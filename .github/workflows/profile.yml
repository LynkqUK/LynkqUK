name: Profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-summary-card-output/**"

permissions:
  contents: write

jobs:
  cards:
    name: Profile summary cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}

  recolor:
    name: Match cards to the theme
    needs: cards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/recolor_cards.py
      - name: Commit recolored cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-summary-card-output/lynkquk
          git diff --cached --quiet || (git commit -m "Recolor summary cards to profile theme" && git push)

  banners:
    name: Rebuild banners
    needs: recolor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 .github/scripts/banners.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23f0f6fc&color_dots=%23151b23,%232d333b,%23545d68,%239198a1,%23f0f6fc&color_dot_border=%230d1117
      - name: Place snake
        run: cp dist/snake.svg art/snake.svg
      - name: Commit banners
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art
          git diff --cached --quiet || (git commit -m "Rebuild banners" && git pull --rebase origin main && git push)
