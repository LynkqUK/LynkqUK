<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}:root{--w:#f5f5f5;--m:#8a8f98;--l:#2c313a;--bg:#0d1117}.fw{fill:var(--w)}.fm{fill:var(--m)}.fl{fill:var(--l)}.fbg{fill:var(--bg)}.sw{stroke:var(--w)}.sm{stroke:var(--m)}.sl{stroke:var(--l)}.sbg{stroke:var(--bg)}.nf{fill:none}.fa{animation:fa 18s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-60px)}to{transform:translateX(60px)}}.fc{animation:fc 24s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.dot{animation:dot 1.4s steps(1) infinite}@keyframes dot{0%,49%{opacity:1}50%,100%{opacity:.15}}.caret{animation:dot 1s steps(1) infinite;animation-delay:4.6s;opacity:0}.zoom{transform-box:fill-box;transform-origin:center;animation:zm 12s ease-in-out infinite alternate}@keyframes zm{from{transform:scale(1.02)}to{transform:scale(1.16)}}.scan{animation:sc 5s linear infinite}@keyframes sc{from{transform:translateY(0)}to{transform:translateY(293px)}}</style>
