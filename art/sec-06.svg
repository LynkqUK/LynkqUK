<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 72" width="880" height="72" role="img" aria-label="Section 6: SNAKE">
<defs><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF6B7D" stop-opacity="0"/><stop offset="0.5" stop-color="#FF6B7D" stop-opacity="1"/><stop offset="1" stop-color="#FF6B7D" stop-opacity="0"/></linearGradient><clipPath id="cp"><rect x="1" y="1" width="878" height="70" rx="10"/></clipPath></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.gl{animation:sw 4.5s ease-in-out infinite;animation-delay:2.4s}
@keyframes sw{from{transform:translateX(-240px)}to{transform:translateX(880px)}}
.ga{animation:ga 6s steps(1) infinite;animation-delay:4.2s}
@keyframes ga{0%,90%,100%{transform:translate(0,0);opacity:0}91%{transform:translate(-4px,1px);opacity:1}93%{transform:translate(4px,-1px);opacity:1}95%{opacity:0}}
.num{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
</style>

<rect x="1" y="1" width="878" height="70" rx="10" fill="#120709" stroke="#46151C" stroke-width="2"/>
<g clip-path="url(#cp)"><rect class="gl" x="0" y="67" width="240" height="3" fill="url(#gl)"/></g>
<text class="num" x="30" y="45" font-size="22" font-weight="700" fill="#E03A4E" letter-spacing="2">[ 06 ]</text>
<text class="ga" x="128" y="46" font-size="24" font-weight="800" fill="#E03A4E" letter-spacing="7">SNAKE</text>
<text x="128" y="45" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="7">SNAKE</text>
<text x="850" y="45" text-anchor="end" font-size="11" fill="#6B6B6B" letter-spacing="3">EVERY COMMIT COUNTS</text>

</svg>
