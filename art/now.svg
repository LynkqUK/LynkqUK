<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Currently building, learning and exploring">
<defs></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.p{animation:pp 2.4s ease-in-out infinite}
@keyframes pp{0%,100%{opacity:.35}50%{opacity:1}}
</style>

<g transform="translate(0,0)">
  <rect x="1" y="1" width="278" height="218" rx="12" fill="#120709" stroke="#46151C" stroke-width="2"/>
  <circle class="p" cx="254" cy="30" r="4" fill="#E03A4E" style="animation-delay:0.0s"/>
  <text x="24" y="34" font-size="12" letter-spacing="4" fill="#E03A4E">BUILDING</text>
  <text x="24" y="88" font-size="16" font-weight="700" fill="#FFFFFF">Small projects that ship</text>
  <text x="24" y="114" font-size="12" fill="#6B6B6B">finished beats perfect</text>
  <rect x="24" y="150" width="232" height="8" rx="4" fill="#1C0A0D"/>
  <rect x="24" y="150" width="0" height="8" rx="4" fill="#E03A4E">
    <animate attributeName="width" values="0;162;162;0" keyTimes="0;0.4;0.9;1" dur="7s" begin="0.0s" repeatCount="indefinite"/>
  </rect>
  <text x="24" y="186" font-size="11" letter-spacing="3" fill="#6B6B6B">IN PROGRESS</text>
</g>
<g transform="translate(300,0)">
  <rect x="1" y="1" width="278" height="218" rx="12" fill="#120709" stroke="#46151C" stroke-width="2"/>
  <circle class="p" cx="254" cy="30" r="4" fill="#E03A4E" style="animation-delay:0.6s"/>
  <text x="24" y="34" font-size="12" letter-spacing="4" fill="#E03A4E">LEARNING</text>
  <text x="24" y="88" font-size="16" font-weight="700" fill="#FFFFFF">Python · C++ · the web</text>
  <text x="24" y="114" font-size="12" fill="#6B6B6B">fundamentals first</text>
  <rect x="24" y="150" width="232" height="8" rx="4" fill="#1C0A0D"/>
  <rect x="24" y="150" width="0" height="8" rx="4" fill="#E03A4E">
    <animate attributeName="width" values="0;127;127;0" keyTimes="0;0.4;0.9;1" dur="7s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <text x="24" y="186" font-size="11" letter-spacing="3" fill="#6B6B6B">IN PROGRESS</text>
</g>
<g transform="translate(600,0)">
  <rect x="1" y="1" width="278" height="218" rx="12" fill="#120709" stroke="#46151C" stroke-width="2"/>
  <circle class="p" cx="254" cy="30" r="4" fill="#E03A4E" style="animation-delay:1.2s"/>
  <text x="24" y="34" font-size="12" letter-spacing="4" fill="#E03A4E">EXPLORING</text>
  <text x="24" y="88" font-size="16" font-weight="700" fill="#FFFFFF">How real software works</text>
  <text x="24" y="114" font-size="12" fill="#6B6B6B">reading code, breaking things</text>
  <rect x="24" y="150" width="232" height="8" rx="4" fill="#1C0A0D"/>
  <rect x="24" y="150" width="0" height="8" rx="4" fill="#E03A4E">
    <animate attributeName="width" values="0;92;92;0" keyTimes="0;0.4;0.9;1" dur="7s" begin="1.0s" repeatCount="indefinite"/>
  </rect>
  <text x="24" y="186" font-size="11" letter-spacing="3" fill="#6B6B6B">IN PROGRESS</text>
</g>
</svg>
