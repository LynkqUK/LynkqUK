<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 250" width="880" height="250" role="img" aria-label="Building small projects, learning Python, C++ and the web, exploring how real software works">
<defs><filter id="fb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter><radialGradient id="fgr"><stop offset="0" stop-color="#aab2bb" stop-opacity="0.16"/><stop offset="0.6" stop-color="#aab2bb" stop-opacity="0.06"/><stop offset="1" stop-color="#aab2bb" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}:root{--w:#f5f5f5;--m:#8a8f98;--l:#2c313a;--bg:#0d1117}.fw{fill:var(--w)}.fm{fill:var(--m)}.fl{fill:var(--l)}.fbg{fill:var(--bg)}.sw{stroke:var(--w)}.sm{stroke:var(--m)}.sl{stroke:var(--l)}.sbg{stroke:var(--bg)}.nf{fill:none}.fa{animation:fa 18s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-60px)}to{transform:translateX(60px)}}.fc{animation:fc 24s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.dot{animation:dot 1.6s steps(1) infinite}@keyframes dot{0%,49%{opacity:1}50%,100%{opacity:.2}}</style>
<ellipse class="fa" cx="264.0" cy="125.0" rx="193.6" ry="120.0" fill="url(#fgr)" opacity="0.80"/><ellipse class="fc" cx="616.0" cy="125.0" rx="193.6" ry="120.0" fill="url(#fgr)" opacity="0.64"/><text x="2" y="36" font-size="15" letter-spacing="6" class="fm">BUILDING</text><circle class="dot fw" cx="259" cy="31" r="4" style="animation-delay:0.0s"/><text x="2" y="104" font-size="27" font-weight="800" class="fw">Small projects</text><text x="2" y="138" font-size="27" font-weight="800" class="fw">that ship</text><text x="2" y="176" font-size="16" class="fm">finished beats perfect</text><line class="sl" x1="2" y1="206" x2="242" y2="206" stroke-width="2"/><line class="sw" x1="2" y1="206" x2="2" y2="206" stroke-width="2"><animate attributeName="x2" values="2;170;170;2" keyTimes="0;0.4;0.9;1" dur="7s" begin="0.0s" repeatCount="indefinite"/></line><text x="2" y="238" font-size="13" letter-spacing="4" class="fm">IN PROGRESS</text><line class="sl" x1="293" y1="14" x2="293" y2="236" stroke-width="1"/><text x="321" y="36" font-size="15" letter-spacing="6" class="fm">LEARNING</text><circle class="dot fw" cx="566" cy="31" r="4" style="animation-delay:0.5s"/><text x="321" y="104" font-size="27" font-weight="800" class="fw">Python, C++</text><text x="321" y="138" font-size="27" font-weight="800" class="fw">and the web</text><text x="321" y="176" font-size="16" class="fm">fundamentals first</text><line class="sl" x1="321" y1="206" x2="561" y2="206" stroke-width="2"/><line class="sw" x1="321" y1="206" x2="321" y2="206" stroke-width="2"><animate attributeName="x2" values="321;453;453;321" keyTimes="0;0.4;0.9;1" dur="7s" begin="0.5s" repeatCount="indefinite"/></line><text x="321" y="238" font-size="13" letter-spacing="4" class="fm">IN PROGRESS</text><line class="sl" x1="586" y1="14" x2="586" y2="236" stroke-width="1"/><text x="614" y="36" font-size="15" letter-spacing="6" class="fm">EXPLORING</text><circle class="dot fw" cx="859" cy="31" r="4" style="animation-delay:1.0s"/><text x="614" y="104" font-size="27" font-weight="800" class="fw">How real</text><text x="614" y="138" font-size="27" font-weight="800" class="fw">software works</text><text x="614" y="176" font-size="16" class="fm">break things, read code</text><line class="sl" x1="614" y1="206" x2="854" y2="206" stroke-width="2"/><line class="sw" x1="614" y1="206" x2="614" y2="206" stroke-width="2"><animate attributeName="x2" values="614;710;710;614" keyTimes="0;0.4;0.9;1" dur="7s" begin="1.0s" repeatCount="indefinite"/></line><text x="614" y="238" font-size="13" letter-spacing="4" class="fm">IN PROGRESS</text>
