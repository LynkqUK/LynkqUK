<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 4" width="800" height="4" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="base" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8B2635" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#8B2635" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B2635" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glint" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#FF6B7D" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF6B7D" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF6B7D" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .glint { animation: sweep 4.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-200px); } 100% { transform: translateX(800px); } }
  </style>
  <rect x="0" y="1" width="800" height="2" fill="url(#base)"/>
  <rect class="glint" x="0" y="0" width="200" height="4" fill="url(#glint)"/>
</svg>
