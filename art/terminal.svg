<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" role="img" aria-label="Terminal: whoami, focus, skills, git status">
  <style>
    .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 15px; }
    .p { fill: #E03A4E; }
    .t { fill: #C9C9C9; }
    .d { fill: #6B6B6B; }
    .w { fill: #FFFFFF; }
    .line { opacity: 0; animation: show 0.01s forwards; }
    .l1 { animation-delay: 0.6s; }
    .l2 { animation-delay: 1.4s; }
    .l3 { animation-delay: 2.2s; }
    .l4 { animation-delay: 3.0s; }
    .l5 { animation-delay: 3.8s; }
    .l6 { animation-delay: 4.6s; }
    .l7 { animation-delay: 5.4s; }
    .cursor { animation: blink 1s steps(1) infinite; animation-delay: 5.4s; opacity: 0; }
    @keyframes show { to { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  </style>

  <rect x="1" y="1" width="818" height="268" rx="12" fill="#0B0B0B" stroke="#3A1118" stroke-width="2"/>
  <rect x="1" y="1" width="818" height="38" rx="12" fill="#140709"/>
  <rect x="1" y="26" width="818" height="13" fill="#140709"/>
  <circle cx="26" cy="20" r="6" fill="#E03A4E"/>
  <circle cx="48" cy="20" r="6" fill="#8B2635"/>
  <circle cx="70" cy="20" r="6" fill="#46151C"/>
  <text x="410" y="25" text-anchor="middle" class="mono d" style="font-size:13px">lynkquk@github: ~</text>

  <g class="mono">
    <g class="line l1"><text x="28" y="72"><tspan class="p">$</tspan><tspan class="t"> whoami</tspan></text></g>
    <g class="line l2"><text x="28" y="96"><tspan class="w">LynkqUK</tspan><tspan class="d">  // aspiring software developer</tspan></text></g>

    <g class="line l3"><text x="28" y="130"><tspan class="p">$</tspan><tspan class="t"> cat focus.txt</tspan></text></g>
    <g class="line l4"><text x="28" y="154"><tspan class="w">shipping small, learning fast, progress over perfection</tspan></text></g>

    <g class="line l5"><text x="28" y="188"><tspan class="p">$</tspan><tspan class="t"> ls skills/</tspan></text></g>
    <g class="line l6"><text x="28" y="212"><tspan class="w">python   c++   html   css   javascript   git   linux</tspan></text></g>

    <g class="line l7"><text x="28" y="246"><tspan class="p">$</tspan><tspan class="t"> git status</tspan><tspan class="d">   # on branch main, working tree: building</tspan></text></g>
    <rect class="cursor" x="520" y="232" width="9" height="18" fill="#E03A4E"/>
  </g>
</svg>
