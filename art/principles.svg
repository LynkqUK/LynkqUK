<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="Operating principles: systems, clean code, small loops, in public">
<defs><filter id="fb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter><radialGradient id="fgr"><stop offset="0" stop-color="#aab2bb" stop-opacity="0.16"/><stop offset="0.6" stop-color="#aab2bb" stop-opacity="0.06"/><stop offset="1" stop-color="#aab2bb" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}:root{--w:#f5f5f5;--m:#8a8f98;--l:#2c313a;--bg:#0d1117}.fw{fill:var(--w)}.fm{fill:var(--m)}.fl{fill:var(--l)}.fbg{fill:var(--bg)}.sw{stroke:var(--w)}.sm{stroke:var(--m)}.sl{stroke:var(--l)}.sbg{stroke:var(--bg)}.nf{fill:none}.fa{animation:fa 18s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-60px)}to{transform:translateX(60px)}}.fc{animation:fc 24s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}.spin2{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.glow{animation:gw 2.4s ease-in-out infinite}@keyframes gw{0%,100%{opacity:.4}50%{opacity:1}}.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.8s ease-out infinite}@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(1.5);opacity:0}}</style>
<ellipse class="fa" cx="264.0" cy="100.0" rx="193.6" ry="96.0" fill="url(#fgr)" opacity="0.80"/><ellipse class="fc" cx="616.0" cy="100.0" rx="193.6" ry="96.0" fill="url(#fgr)" opacity="0.64"/><circle class="spin nf sw" cx="110.0" cy="62" r="28" stroke-width="2" stroke-dasharray="6 9"/><circle class="fw" cx="110.0" cy="62" r="5"/><text x="110.0" y="146" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="2" class="fw">SYSTEMS</text><text x="110.0" y="176" text-anchor="middle" font-size="15" class="fm">over motivation</text><line class="sl" x1="220" y1="10" x2="220" y2="190" stroke-width="1"/><text class="glow fw" x="330.0" y="73" text-anchor="middle" font-size="32" font-weight="800">&lt;/&gt;</text><text x="330.0" y="146" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="2" class="fw">CLEAN CODE</text><text x="330.0" y="176" text-anchor="middle" font-size="15" class="fm">readable first</text><line class="sl" x1="440" y1="10" x2="440" y2="190" stroke-width="1"/><circle class="nf sl" cx="550.0" cy="62" r="28" stroke-width="2"/><circle class="spin2 nf sw" cx="550.0" cy="62" r="28" stroke-width="2" stroke-dasharray="40 140" stroke-linecap="round"/><text x="550.0" y="146" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="2" class="fw">SMALL LOOPS</text><text x="550.0" y="176" text-anchor="middle" font-size="15" class="fm">ship, learn, repeat</text><line class="sl" x1="660" y1="10" x2="660" y2="190" stroke-width="1"/><circle class="rip nf sw" cx="770.0" cy="62" r="28" stroke-width="2"/><circle class="rip nf sw" cx="770.0" cy="62" r="28" stroke-width="2" style="animation-delay:1.4s"/><circle class="fw" cx="770.0" cy="62" r="5"/><text x="770.0" y="146" text-anchor="middle" font-size="20" font-weight="800" letter-spacing="2" class="fw">IN PUBLIC</text><text x="770.0" y="176" text-anchor="middle" font-size="15" class="fm">commit daily</text>
</svg>
