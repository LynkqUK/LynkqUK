<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 880 214" width="880" height="214" role="img" aria-label="Operating principles: systems, clean code, small loops, in public">
<defs><filter id="fb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter><clipPath id="p0"><rect x="0" y="0" width="205" height="214" rx="16"/></clipPath><clipPath id="p1"><rect x="225" y="0" width="205" height="214" rx="16"/></clipPath><clipPath id="p2"><rect x="450" y="0" width="205" height="214" rx="16"/></clipPath><clipPath id="p3"><rect x="675" y="0" width="205" height="214" rx="16"/></clipPath></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.fa{animation:fa 16s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-70px)}to{transform:translateX(70px)}}.fc{animation:fc 22s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 8s linear infinite}.spin2{transform-box:fill-box;transform-origin:center;animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.glow{animation:gw 2.4s ease-in-out infinite}@keyframes gw{0%,100%{opacity:.5}50%{opacity:1}}.rip{transform-box:fill-box;transform-origin:center;animation:rip 2.6s ease-out infinite}@keyframes rip{from{transform:scale(.3);opacity:.9}to{transform:scale(1.5);opacity:0}}</style>
<rect x="1" y="1" width="203" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/><g clip-path="url(#p0)"><g filter="url(#fb)"><ellipse class="fa" cx="51.25" cy="166.92000000000002" rx="61.5" ry="72.76" fill="#8b949e" opacity="0.110"/><ellipse class="fc" cx="147.6" cy="64.2" rx="65.6" ry="85.60000000000001" fill="#8b949e" opacity="0.080"/></g></g><circle class="spin" cx="102.5" cy="66" r="28" fill="none" stroke="#f20707" stroke-width="3" stroke-dasharray="12 9"/><circle cx="102.5" cy="66" r="7" fill="#f20707"/><text x="102.5" y="148" text-anchor="middle" font-size="20" font-weight="800" fill="#f0f6fc" letter-spacing="2">SYSTEMS</text><text x="102.5" y="178" text-anchor="middle" font-size="15" fill="#9198a1">over motivation</text><rect x="226" y="1" width="203" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/><g clip-path="url(#p1)"><g filter="url(#fb)"><ellipse class="fa" cx="276.25" cy="166.92000000000002" rx="61.5" ry="72.76" fill="#8b949e" opacity="0.110"/><ellipse class="fc" cx="372.6" cy="64.2" rx="65.6" ry="85.60000000000001" fill="#8b949e" opacity="0.080"/></g></g><text class="glow" x="327.5" y="78" text-anchor="middle" font-size="34" font-weight="800" fill="#f20707">&lt;/&gt;</text><text x="327.5" y="148" text-anchor="middle" font-size="20" font-weight="800" fill="#f0f6fc" letter-spacing="2">CLEAN CODE</text><text x="327.5" y="178" text-anchor="middle" font-size="15" fill="#9198a1">readable first</text><rect x="451" y="1" width="203" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/><g clip-path="url(#p2)"><g filter="url(#fb)"><ellipse class="fa" cx="501.25" cy="166.92000000000002" rx="61.5" ry="72.76" fill="#8b949e" opacity="0.110"/><ellipse class="fc" cx="597.6" cy="64.2" rx="65.6" ry="85.60000000000001" fill="#8b949e" opacity="0.080"/></g></g><circle cx="552.5" cy="66" r="28" fill="none" stroke="#1c2330" stroke-width="4"/><circle class="spin2" cx="552.5" cy="66" r="28" fill="none" stroke="#f20707" stroke-width="4" stroke-dasharray="44 140" stroke-linecap="round"/><text x="552.5" y="148" text-anchor="middle" font-size="20" font-weight="800" fill="#f0f6fc" letter-spacing="2">SMALL LOOPS</text><text x="552.5" y="178" text-anchor="middle" font-size="15" fill="#9198a1">ship, learn, repeat</text><rect x="676" y="1" width="203" height="212" rx="16" fill="#151b23" stroke="#30363d" stroke-width="2"/><g clip-path="url(#p3)"><g filter="url(#fb)"><ellipse class="fa" cx="726.25" cy="166.92000000000002" rx="61.5" ry="72.76" fill="#8b949e" opacity="0.110"/><ellipse class="fc" cx="822.6" cy="64.2" rx="65.6" ry="85.60000000000001" fill="#8b949e" opacity="0.080"/></g></g><circle class="rip" cx="777.5" cy="66" r="28" fill="none" stroke="#f20707" stroke-width="2"/><circle class="rip" cx="777.5" cy="66" r="28" fill="none" stroke="#f20707" stroke-width="2" style="animation-delay:1.3s"/><circle cx="777.5" cy="66" r="7" fill="#f20707"/><text x="777.5" y="148" text-anchor="middle" font-size="20" font-weight="800" fill="#f0f6fc" letter-spacing="2">IN PUBLIC</text><text x="777.5" y="178" text-anchor="middle" font-size="15" fill="#9198a1">commit daily</text>
</svg>
