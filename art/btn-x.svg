<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 56" width="160" height="56" role="img" aria-label="X button">
<defs><filter id="fb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="24"/></filter></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.fa{animation:fa 16s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-70px)}to{transform:translateX(70px)}}.fc{animation:fc 22s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.run{stroke-dasharray:60 372;animation:run 3.2s linear infinite}@keyframes run{to{stroke-dashoffset:-432}}.dot{animation:dot 1.6s ease-in-out infinite}@keyframes dot{0%,100%{opacity:.35}50%{opacity:1}}</style>
<rect x="1" y="1" width="158" height="54" rx="12" fill="#151b23" stroke="#30363d" stroke-width="2"/><rect class="run" x="1" y="1" width="158" height="54" rx="12" fill="none" stroke="#f20707" stroke-width="2"/><circle class="dot" cx="22" cy="28.0" r="4.5" fill="#f20707"/><text x="90.0" y="33.5" text-anchor="middle" font-size="15" font-weight="800" fill="#f0f6fc" letter-spacing="3">X</text>
</svg>
