<defs><filter id="fb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter><radialGradient id="fgr"><stop offset="0" stop-color="#aab2bb" stop-opacity="0.16"/><stop offset="0.6" stop-color="#aab2bb" stop-opacity="0.06"/><stop offset="1" stop-color="#aab2bb" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}:root{--w:#f5f5f5;--m:#8a8f98;--l:#2c313a;--bg:#0d1117}.fw{fill:var(--w)}.fm{fill:var(--m)}.fl{fill:var(--l)}.fbg{fill:var(--bg)}.sw{stroke:var(--w)}.sm{stroke:var(--m)}.sl{stroke:var(--l)}.sbg{stroke:var(--bg)}.nf{fill:none}.fa{animation:fa 18s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-60px)}to{transform:translateX(60px)}}.fc{animation:fc 24s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.chk{stroke-dasharray:44;stroke-dashoffset:44;animation:chk .6s ease-out forwards}@keyframes chk{to{stroke-dashoffset:0}}.pend{animation:pd 3s ease-in-out infinite}@keyframes pd{0%,100%{opacity:.35}50%{opacity:1}}</style>
