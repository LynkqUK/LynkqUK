<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 160 56" width="160" height="56" role="img" aria-label="EMAIL button">
<defs><filter id="fb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter><radialGradient id="fgr"><stop offset="0" stop-color="#aab2bb" stop-opacity="0.16"/><stop offset="0.6" stop-color="#aab2bb" stop-opacity="0.06"/><stop offset="1" stop-color="#aab2bb" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}:root{--w:#f5f5f5;--m:#8a8f98;--l:#2c313a;--bg:#0d1117}.fw{fill:var(--w)}.fm{fill:var(--m)}.fl{fill:var(--l)}.fbg{fill:var(--bg)}.sw{stroke:var(--w)}.sm{stroke:var(--m)}.sl{stroke:var(--l)}.sbg{stroke:var(--bg)}.nf{fill:none}.fa{animation:fa 18s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-60px)}to{transform:translateX(60px)}}.fc{animation:fc 24s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.run{stroke-dasharray:50 382;animation:run 3.4s linear infinite}@keyframes run{to{stroke-dashoffset:-432}}.dot{animation:dot 1.6s steps(1) infinite}@keyframes dot{0%,49%{opacity:1}50%,100%{opacity:.2}}</style>
<rect class="nf sl" x="1" y="1" width="158" height="54" stroke-width="2"/><rect class="run nf sw" x="1" y="1" width="158" height="54" stroke-width="2"/><circle class="dot fw" cx="22" cy="28.0" r="4"/><text x="90.0" y="33.5" text-anchor="middle" font-size="15" font-weight="800" letter-spacing="3" class="fw">EMAIL</text>
</svg>
