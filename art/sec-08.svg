<defs><filter id="fb" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter><radialGradient id="fgr"><stop offset="0" stop-color="#aab2bb" stop-opacity="0.16"/><stop offset="0.6" stop-color="#aab2bb" stop-opacity="0.06"/><stop offset="1" stop-color="#aab2bb" stop-opacity="0"/></radialGradient></defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}:root{--w:#f5f5f5;--m:#8a8f98;--l:#2c313a;--bg:#0d1117}.fw{fill:var(--w)}.fm{fill:var(--m)}.fl{fill:var(--l)}.fbg{fill:var(--bg)}.sw{stroke:var(--w)}.sm{stroke:var(--m)}.sl{stroke:var(--l)}.sbg{stroke:var(--bg)}.nf{fill:none}.fa{animation:fa 18s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-60px)}to{transform:translateX(60px)}}.fc{animation:fc 24s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.draw{stroke-dasharray:880;stroke-dashoffset:880;animation:draw 1.6s ease-out .2s forwards}@keyframes draw{to{stroke-dashoffset:0}}.trav{animation:trav 7s ease-in-out infinite}@keyframes trav{0%,100%{transform:translateX(0)}50%{transform:translateX(872px)}}.ga{animation:ga 7s steps(1) infinite}@keyframes ga{0%,92%,100%{opacity:0;transform:translate(0,0)}93%{opacity:.7;transform:translate(-5px,1px)}95%{opacity:.7;transform:translate(5px,-1px)}97%{opacity:0}}</style>
