<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.fa{animation:fa 16s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-70px)}to{transform:translateX(70px)}}.fc{animation:fc 22s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.beat{stroke-dasharray:22 78;animation:beat 3.4s linear infinite}@keyframes beat{from{stroke-dashoffset:100}to{stroke-dashoffset:-22}}.tx{animation:tx 3s ease-in-out infinite}@keyframes tx{0%,100%{opacity:.65}50%{opacity:1}}</style>
