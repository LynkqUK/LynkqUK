<style>text{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}.fa{animation:fa 16s ease-in-out infinite alternate}@keyframes fa{from{transform:translateX(-70px)}to{transform:translateX(70px)}}.fc{animation:fc 22s ease-in-out infinite alternate}@keyframes fc{from{transform:translateX(60px)}to{transform:translateX(-60px)}}.pc{animation:pc 2.2s ease-in-out infinite}@keyframes pc{0%,100%{opacity:.35}50%{opacity:1}}.gl{animation:sw 5s ease-in-out infinite}@keyframes sw{from{transform:translateX(-260px)}to{transform:translateX(880px)}}.ga{animation:ga 6s steps(1) infinite}@keyframes ga{0%,91%,100%{transform:translate(0,0);opacity:0}92%{transform:translate(-4px,1px);opacity:1}94%{transform:translate(4px,-1px);opacity:1}96%{opacity:0}}.nb{animation:nb 2.8s ease-in-out infinite}@keyframes nb{0%,100%{opacity:.7}50%{opacity:1}}</style>
